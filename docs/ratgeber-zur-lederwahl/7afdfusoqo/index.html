<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ratgeber zur Lederwahl · Leder &amp; Werkstatt</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5EDE0;--paper:#FDF8F2;--ink:#1A0F08;--ink-soft:#5A4232;--accent:#E0A15E;--accent-dark:#B5611F;--line:#E6D5C0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:'DM Sans',-apple-system,Arial,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.top{background:var(--accent-dark);color:var(--paper);text-align:center;padding:11px 16px;font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:15px}
.wrap{max-width:720px;margin:0 auto;padding:32px 16px 56px}
.head{text-align:center;margin-bottom:28px}
.kicker{display:inline-block;background:var(--accent);color:var(--paper);padding:6px 14px;border-radius:99px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px}
h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(26px,5vw,40px);line-height:1.15;margin-bottom:12px}
.sub{color:var(--ink-soft);font-size:17px;max-width:600px;margin:0 auto 24px;line-height:1.55}
.download-card{background:var(--paper);border:2px solid var(--accent);border-radius:20px;padding:32px 28px;text-align:center;box-shadow:0 12px 32px rgba(26,15,8,.08)}
.download-icon{width:72px;height:90px;margin:0 auto 20px;background:linear-gradient(160deg,var(--accent-dark),var(--accent));border-radius:6px 12px 12px 6px;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 6px 16px rgba(181,97,31,.25)}
.download-icon::before{content:'';position:absolute;left:0;top:0;width:7px;height:100%;background:rgba(0,0,0,.12);border-radius:6px 0 0 6px}
.download-icon svg{width:32px;height:32px;fill:var(--paper)}
.stats-row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 18px;text-align:center;min-width:100px}
.stat b{display:block;font-family:'Playfair Display',Georgia,serif;font-size:24px;color:var(--accent-dark);line-height:1.1}
.stat span{font-size:12px;font-weight:600;color:var(--ink-soft);letter-spacing:.04em}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:14px 28px;border-radius:12px;font-weight:800;font-size:17px;text-decoration:none;border:2px solid transparent;transition:filter .12s}
.btn:hover{filter:brightness(1.06)}
.btn.primary{background:var(--accent);color:var(--paper);box-shadow:0 4px 0 var(--accent-dark)}
.btn.primary:active{box-shadow:0 2px 0 var(--accent-dark);transform:translateY(2px)}
.btn.ghost{color:var(--accent-dark);border-color:var(--line);background:var(--paper)}
.btn svg{width:20px;height:20px;fill:currentColor;flex-shrink:0}
.foot{text-align:center;color:var(--ink-soft);font-size:13px;margin-top:32px}
@media(max-width:520px){.btn{width:100%}.stat{min-width:80px;padding:10px 12px}.stat b{font-size:20px}}
</style>
</head>
<body>
<div class="top">Leder &amp; Werkstatt</div>
<main class="wrap">
  <div class="head">
    <span class="kicker">Bonus 1 von 3</span>
    <h1>Ratgeber zur Lederwahl</h1>
    <p class="sub">Alles über Lederarten, Gerbung und empfohlene Stärken — damit du immer das richtige Leder kaufst.</p>
  </div>
  <div class="download-card">
    <div class="download-icon">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 2l5 5h-5V4zm-1 13l-4-4h2.5v-4h3v4H16l-4 4z"/></svg>
    </div>
    <div class="stats-row">
      <div class="stat"><b>14</b><span>Seiten</span></div>
      <div class="stat"><b>&#x221E;</b><span>Lebenslanger Zugang</span></div>
    </div>
    <div class="actions">
      <a class="btn primary" href="ratgeber-zur-lederwahl.pdf" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zm-8 2V5h2v6h1.17L12 13.17 9.83 11H11zm-6 7h14v2H5v-2z"/></svg>
        PDF öffnen
      </a>
      <a class="btn ghost" href="ratgeber-zur-lederwahl.pdf" download>
        <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zm7-18L5.33 9h3.17v4h5V9h3.17L12 2z" transform="rotate(180 12 12)"/></svg>
        Auf Gerät speichern
      </a>
    </div>
  </div>
  <p class="foot">Nur für den persönlichen Gebrauch. Weiterverkauf und Weitergabe verboten.</p>
</main>
</body>
</html>
